<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div class="container py-4"><h1>Painel Admin</h1><p>Este painel exige `x-admin-key` ou login JWT via /api/auth/login</p><div id="stats"></div><h2>Visitas (últimas)</h2><div id="visits"></div><h2>Pedidos</h2><div id="requests"></div></div><script>async function load(){ const key=prompt('Insere x-admin-key'); if(!key) return alert('Chave necessária'); const headers={ 'x-admin-key': key }; const s=await fetch('/admin/${process.env.get("ADMIN_PATH") || "SECRET"}', {headers}); console.log(s); // use API endpoints
 const stats=await fetch('/admin/${process.env.get("ADMIN_PATH") || "SECRET"}/stats',{headers}).then(r=>r.json()); document.getElementById('stats').innerText=JSON.stringify(stats,null,2); const visits=await fetch('/admin/${process.env.get("ADMIN_PATH") || "SECRET"}/visits',{headers}).then(r=>r.json()); document.getElementById('visits').innerText=JSON.stringify(visits.slice(0,20),null,2); const req=await fetch('/admin/${process.env.get("ADMIN_PATH") || "SECRET"}/requests',{headers}).then(r=>r.json()); document.getElementById('requests').innerText=JSON.stringify(req.slice(0,20),null,2); } load();</script></body></html>
