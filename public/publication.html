<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicação</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div class="container py-4" id="root"></div><script>async function load(){ const params=new URLSearchParams(location.search); const slug=params.get('slug'); if(!slug){document.getElementById('root').innerText='Slug missing';return;} const r=await fetch('/api/publications/'+slug); if(!r.ok){document.getElementById('root').innerText='Not found';return;} const p=await r.json(); document.getElementById('root').innerHTML=`<h1>${p.title}</h1><p><small>${p.author} — ${new Date(p.publishedAt||p.createdAt).toLocaleDateString()}</small></p><div>${p.content}</div><h4>Anexos</h4><ul>${(p.attachments||[]).map(a=>`<li><a href="${a.url}" target="_blank">${a.filename}</a></li>`).join('')}</ul>`;} load();</script></body></html>
